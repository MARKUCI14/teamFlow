name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      compose: ${{ steps.check.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/gradlew ] \
            && { [ -f backend/settings.gradle.kts ] || [ -f backend/settings.gradle ]; } \
            && { [ -f backend/build.gradle.kts ] || [ -f backend/build.gradle ]; }; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f docker-compose.yml ] && echo "compose=true" >> "$GITHUB_OUTPUT" || echo "compose=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and lint (Testcontainers needs Docker, available on runner)
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend build files
        run: |
          test -f package-lock.json || { echo "frontend/package-lock.json is required for npm ci."; exit 1; }
          node -e 'const p = require("./package.json"); for (const script of ["lint", "build"]) { if (!p.scripts?.[script]) { console.error(`frontend/package.json must define the ${script} script.`); process.exitCode = 1; } }'
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

  containers:
    needs: [detect, backend, frontend]
    if: always() && needs.detect.outputs.compose == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --env-file .env.example config -q
      - name: Build images
        run: docker compose --env-file .env.example build

  # Keep one required check available even while optional modules are absent.
  ci:
    name: ci
    needs: [detect, backend, frontend, containers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check module results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          for result in "$DETECT_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$CONTAINERS_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A CI job did not complete successfully."
              exit 1
            fi
          done
