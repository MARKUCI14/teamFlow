name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            compose:
              - 'docker-compose.yml'
              - '.env.example'
              - 'scripts/**'
              - 'backend/**/Dockerfile'
              - 'frontend/**/Dockerfile'

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow -d teamflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORK_DB_URL: jdbc:postgresql://localhost:5432/teamflow
      WORK_DB_USERNAME: teamflow
      WORK_DB_PASSWORD: ci-test-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and lint (Testcontainers needs Docker, available on runner)
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend build files
        run: |
          test -f package-lock.json || { echo "frontend/package-lock.json is required for npm ci."; exit 1; }
          node -e 'const p = require("./package.json"); for (const script of ["lint", "build"]) { if (!p.scripts?.[script]) { console.error(`frontend/package.json must define the ${script} script.`); process.exitCode = 1; } }'
      - run: npm ci
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

  compose-validation:
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local JWT keys required by Compose configuration
        run: ./scripts/generate-jwt-keys.sh
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q

  image-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local JWT keys required by Compose
        run: ./scripts/generate-jwt-keys.sh
      - name: Build Compose images
        run: docker compose --env-file .env.example build

  # Keep one required check available even while optional jobs are skipped.
  ci:
    name: ci
    needs: [detect, backend, frontend, compose-validation, image-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check module results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMPOSE_RESULT: ${{ needs.compose-validation.result }}
          IMAGE_BUILD_RESULT: ${{ needs.image-build.result }}
        run: |
          for result in "$DETECT_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$COMPOSE_RESULT" "$IMAGE_BUILD_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A CI job did not complete successfully."
              exit 1
            fi
          done
