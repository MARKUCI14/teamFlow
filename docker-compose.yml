services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    image: teamflow-user-service:local
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      USER_DB_URL: ${USER_DB_URL:-jdbc:postgresql://postgres:5432/teamflow}
      USER_DB_USERNAME: ${USER_DB_USERNAME:-${POSTGRES_USER}}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      JWT_ISSUER: ${JWT_ISSUER:-http://user-service:8081}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_PRIVATE_KEY_PATH: /run/secrets/teamflow-jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/teamflow-jwt-public.pem
    secrets:
      - source: user_jwt_private_key
        target: teamflow-jwt-private.pem
      - source: user_jwt_public_key
        target: teamflow-jwt-public.pem

  api-gateway:
    image: teamflow-api-gateway:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    depends_on:
      - user-service
      - work-management-service
      - report-service
    environment:
      SERVER_PORT: 8080
      JWT_ISSUER: ${JWT_ISSUER:-http://user-service:8081}
      USER_SERVICE_URL: http://user-service:8081
      WORK_MANAGEMENT_SERVICE_URL: http://work-management-service:8082
      REPORT_SERVICE_URL: http://report-service:8084
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

  work-management-service:
    image: teamflow-work-management-service:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: work-management-service
    environment:
      SERVER_PORT: 8082

  notification-service:
    image: teamflow-notification-service:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    environment:
      SERVER_PORT: 8083

  report-service:
    image: teamflow-report-service:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: report-service
    environment:
      SERVER_PORT: 8084

  report-function:
    image: teamflow-report-function:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: report-function
    environment:
      SERVER_PORT: 8085

  rabbitmq:
    image: rabbitmq:4.4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Set RABBIT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - ./.local/kafka-certs:/etc/kafka/secrets:ro
      - ./scripts/kafka-healthcheck.sh:/usr/local/bin/kafka-healthcheck.sh:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The official image loads its TLS files when an advertised listener is named SSL.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL,SSL:SASL_SSL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,SSL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,SSL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USERNAME:?Set KAFKA_USERNAME in .env}"
        password="${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}"
        user_${KAFKA_USERNAME:?Set KAFKA_USERNAME in .env}="${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}";
      KAFKA_LISTENER_NAME_SSL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USERNAME:?Set KAFKA_USERNAME in .env}"
        password="${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}"
        user_${KAFKA_USERNAME:?Set KAFKA_USERNAME in .env}="${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}";
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka_ssl_key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka_truststore_creds
      # Load the truststore for internal TLS; client certificates are optional.
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_USERNAME: ${KAFKA_USERNAME:?Set KAFKA_USERNAME in .env}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}
      KAFKA_TLS_PASSWORD: ${KAFKA_TLS_PASSWORD:?Set KAFKA_TLS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/kafka-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

secrets:
  user_jwt_private_key:
    file: ./.local/jwt-keys/private.pem
  user_jwt_public_key:
    file: ./.local/jwt-keys/public.pem
