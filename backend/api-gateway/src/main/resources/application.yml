spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: "${USER_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/auth/**,/api/users/**,/.well-known/jwks.json
            - id: work-management-service
              uri: "${WORK_MANAGEMENT_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/projects/**,/api/submissions/**,/api/issues/**,/api/worklogs/**
            - id: report-service
              uri: "${REPORT_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/reports/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
