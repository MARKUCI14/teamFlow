spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: "${USER_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/auth/**,/api/users/**,/.well-known/jwks.json
            - id: work-management-service
              uri: "${WORK_MANAGEMENT_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/projects/**,/api/submissions/**,/api/issues/**,/api/worklogs/**
            - id: report-service
              uri: "${REPORT_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/reports/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

teamflow:
  gateway:
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
