spring:
  application:
    name: work-management-service
  datasource:
    url: ${WORK_DB_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${WORK_DB_USERNAME:teamflow}
    password: ${WORK_DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${WORK_DB_SCHEMA:work_management}
  flyway:
    enabled: true
    schemas: ${WORK_DB_SCHEMA:work_management}
    default-schema: ${WORK_DB_SCHEMA:work_management}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  mvc:
    problemdetails:
      enabled: true
teamflow:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    submissions-topic: ${KAFKA_SUBMISSIONS_TOPIC:submissions.events}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    username: ${KAFKA_USERNAME:teamflow}
    password: ${KAFKA_PASSWORD:change-me-locally}
    ssl-truststore-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:.local/kafka-certs/kafka.truststore.jks}
    tls-password: ${KAFKA_TLS_PASSWORD:change-me-locally}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
